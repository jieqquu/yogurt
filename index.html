<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="優格調配板">
<title>優格出餐調配板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f7f5f0; --surface: #ffffff; --surface2: #f0ede8;
    --text: #1a1814; --text2: #6b6560; --text3: #a09a94;
    --accent: #2d5a3d; --accent-light: #e8f0eb; --accent-text: #1e3d2a;
    --warn: #7a5c1e; --warn-light: #fdf3e0;
    --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.15);
    --radius: 14px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141210; --surface: #1e1c19; --surface2: #252320;
      --text: #f0ece6; --text2: #9a948e; --text3: #6a6460;
      --accent: #4a8c60; --accent-light: #1a2e20; --accent-text: #8fd4a8;
      --warn: #c49a3c; --warn-light: #2a2010;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    }
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', sans-serif; }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 80px); }

  .app-header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 16px 20px 14px; position: sticky; top: 0; z-index: 10; }
  .app-header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .app-header p { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .tabs-wrap { background: var(--surface); padding: 12px 16px; border-bottom: 0.5px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tabs { display: flex; gap: 8px; width: max-content; }
  .tab-btn { padding: 7px 16px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 14px; cursor: pointer; white-space: nowrap; font-family: inherit; transition: all 0.18s; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }

  .content { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 600px; margin: 0 auto; }

  .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sum-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
  .sum-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .sum-val { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .sum-unit { font-size: 12px; color: var(--text3); margin-left: 1px; }

  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-title { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; padding: 14px 16px 0; }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 16px; }
  .inp-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .inp-row { display: flex; align-items: center; gap: 8px; }
  .inp-row input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); font-size: 16px; font-family: inherit; outline: none; -webkit-appearance: none; }
  .inp-row input:focus { border-color: var(--accent); }
  .inp-unit { font-size: 13px; color: var(--text3); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; }
  .tbl-wrap { padding: 0 0 4px; }
  th { font-size: 11px; color: var(--text3); font-weight: 400; text-align: left; padding: 10px 16px 8px; border-bottom: 0.5px solid var(--border); }
  td { padding: 10px 16px; border-bottom: 0.5px solid var(--border); font-size: 15px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .td-name { color: var(--text); font-weight: 500; }
  .td-base { color: var(--text3); font-size: 13px; }
  .td-inp { display: flex; align-items: center; gap: 6px; }
  .td-inp input { width: 88px; height: 38px; padding: 0 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text); font-size: 15px; font-family: inherit; outline: none; -webkit-appearance: none; }
  .td-inp input:focus { border-color: var(--accent); }
  .td-unit { font-size: 12px; color: var(--text3); }
  tr.yogurt-row td { background: var(--accent-light); }
  tr.yogurt-row .td-name { color: var(--accent-text); }
  tr.total-row td { background: var(--surface2); font-size: 13px; font-weight: 600; color: var(--text2); }
  .total-val { transition: color 0.2s; }
  .total-val.pending { color: var(--accent); }

  .cream-block { margin: 0 16px 14px; background: var(--warn-light); border: 0.5px solid rgba(122,92,30,0.25); border-radius: var(--radius-sm); padding: 12px; }
  .cream-title { font-size: 12px; font-weight: 600; color: var(--warn); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cream-badge { font-size: 10px; background: var(--warn); color: #fff; padding: 2px 7px; border-radius: 10px; font-weight: 400; }
  .cream-table { width: 100%; border-collapse: collapse; }
  .cream-table td { padding: 5px 2px; font-size: 13px; border-bottom: 0.5px solid rgba(122,92,30,0.15); }
  .cream-table tr:last-child td { border-bottom: none; font-weight: 600; }
  .cream-table .c-val { text-align: right; color: var(--warn); font-weight: 500; }
  .cream-note { font-size: 11px; color: var(--text3); margin-top: 8px; line-height: 1.5; }

  .reset-wrap { padding: 12px 16px 14px; }
  .reset-btn { width: 100%; padding: 11px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 14px; font-family: inherit; cursor: pointer; }
  .reset-btn:active { background: var(--surface2); }
</style>
</head>
<body>
<div class="app-header">
  <h1>優格出餐調配板</h1>
  <p>輸入數值後按 ✓ 或 Enter 換算</p>
</div>
<div class="tabs-wrap"><div class="tabs" id="flavorTabs"></div></div>
<div class="content">
  <div class="summary-row">
    <div class="sum-card"><div class="sum-label">優格</div><div><span class="sum-val" id="r-yogurt">—</span><span class="sum-unit">g</span></div></div>
    <div class="sum-card"><div class="sum-label">總重</div><div><span class="sum-val" id="r-total">—</span><span class="sum-unit">g</span></div></div>
    <div class="sum-card"><div class="sum-label">份數</div><div><span class="sum-val" id="r-portions">—</span><span class="sum-unit">份</span></div></div>
  </div>
  <div class="card">
    <div class="card-title">快速輸入</div>
    <div class="quick-grid">
      <div><div class="inp-label">優格重量</div><div class="inp-row"><input type="number" inputmode="decimal" id="yogurtInput" placeholder="500" /><span class="inp-unit">克</span></div></div>
      <div><div class="inp-label">成品總重</div><div class="inp-row"><input type="number" inputmode="decimal" id="totalInput" placeholder="588" /><span class="inp-unit">克</span></div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title" style="padding-bottom:2px;">食材明細</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>食材</th><th>基準</th><th>用量</th></tr></thead>
        <tbody id="ingredientBody"></tbody>
      </table>
    </div>
    <div id="creamBlock" style="display:none;">
      <div class="cream-block">
        <div class="cream-title">☕ 咖啡奶霜製作用量 <span class="cream-badge">需先做好再加入</span></div>
        <table class="cream-table" id="creamTable"></table>
        <div class="cream-note" id="creamNote"></div>
      </div>
    </div>
    <div class="reset-wrap"><button class="reset-btn" id="resetBtn">重置</button></div>
  </div>
</div>

<script>
const flavors = [
  { name:"蘋果伯爵", portionSize:200, ingredients:[{name:"優格",key:"yogurt",base:500},{name:"蘋果醬",key:"apple",base:200},{name:"伯爵茶粉",key:"earl",base:14}] },
  { name:"黑芝麻", portionSize:200, ingredients:[{name:"優格",key:"yogurt",base:500},{name:"芝麻醬",key:"sesame",base:50},{name:"海藻糖",key:"trehalose",base:100}] },
  { name:"開心果", portionSize:131, ingredients:[{name:"優格",key:"yogurt",base:100},{name:"開心果醬",key:"pistachio",base:12},{name:"海藻糖",key:"trehalose",base:19},{name:"海鹽",key:"salt",base:0.3}] },
  { name:"蘋果肉桂", portionSize:180, ingredients:[{name:"優格",key:"yogurt",base:375},{name:"蘋果醬",key:"apple",base:162},{name:"肉桂粉",key:"cinnamon",base:3}] },
  { name:"焙茶", portionSize:60, ingredients:[{name:"優格",key:"yogurt",base:50},{name:"焙茶粉",key:"hojicha",base:2},{name:"海藻糖",key:"trehalose",base:8}] },
  {
    name:"咖啡拿鐵", portionSize:200, hasCream:true,
    creamRecipe:{ baseYield:88.2, useAmount:70, ingredients:[{name:"牛奶",base:63},{name:"吉利丁",base:1.3},{name:"即溶咖啡粉",base:7.9},{name:"海藻糖",base:16}] },
    ingredients:[{name:"慢萃優格",key:"yogurt",base:364.3},{name:"咖啡奶霜",key:"cream",base:70},{name:"海藻糖",key:"trehalose",base:104},{name:"異麥芽寡糖漿",key:"isomalto",base:50}]
  }
];

let current = 0;
let currentTotal = null; // 當前已確認的總量
const r = (v,d=1) => Math.round(v*Math.pow(10,d))/Math.pow(10,d);
const ft = f => f.ingredients.reduce((s,i)=>s+i.base,0);

// 記錄哪個 input 正在被編輯，避免重新渲染時搶焦點
let focusedIngIdx = null; // null = 快速輸入區, -1 = yogurtInput, -2 = totalInput

function selectFlavor(idx) {
  current = idx;
  currentTotal = null;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('yogurtInput').value='';
  document.getElementById('totalInput').value='';
  focusedIngIdx = null;
  buildTable();
  updateSummary(null);
  renderCream(null);
}

function applyTotal(total) {
  currentTotal = total;
  const f = flavors[current];
  const fTotal = ft(f);
  const yRatio = f.ingredients.find(i=>i.key==='yogurt').base/fTotal;

  // 更新快速輸入區（只在沒有焦點時更新）
  if (focusedIngIdx !== -1) document.getElementById('yogurtInput').value = total !== null ? r(total*yRatio) : '';
  if (focusedIngIdx !== -2) document.getElementById('totalInput').value = total !== null ? r(total) : '';

  // 更新食材列（跳過正在編輯的那個）
  if (total !== null) {
    f.ingredients.forEach((ing, i) => {
      if (focusedIngIdx === i) return;
      const inp = document.querySelector(`input[data-ing="${i}"]`);
      if (inp) inp.value = r(total * (ing.base/fTotal), 2);
    });
    const totCell = document.getElementById('total-cell');
    if (totCell) totCell.textContent = r(total) + ' g';

    // 咖啡奶霜
    const creamIng = f.ingredients.find(i=>i.key==='cream');
    if (creamIng) renderCream(total * (creamIng.base/fTotal));
    else renderCream(null);
  } else {
    f.ingredients.forEach((ing, i) => {
      if (focusedIngIdx === i) return;
      const inp = document.querySelector(`input[data-ing="${i}"]`);
      if (inp) inp.value = '';
    });
    const totCell = document.getElementById('total-cell');
    if (totCell) totCell.textContent = '—';
    renderCream(null);
  }
  updateSummary(total);
}

function buildTable() {
  const f = flavors[current];
  const tbody = document.getElementById('ingredientBody');
  tbody.innerHTML = '';
  f.ingredients.forEach((ing, i) => {
    const tr = document.createElement('tr');
    if (ing.key==='yogurt') tr.classList.add('yogurt-row');
    tr.innerHTML = `
      <td class="td-name">${ing.name}</td>
      <td class="td-base">${ing.base}g</td>
      <td><div class="td-inp">
        <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="—" data-ing="${i}" />
        <span class="td-unit">g</span>
      </div></td>`;
    tbody.appendChild(tr);
  });
  const tot = document.createElement('tr');
  tot.classList.add('total-row');
  tot.innerHTML = `<td colspan="2">合計</td><td><span id="total-cell">—</span></td>`;
  tbody.appendChild(tot);

  // 事件綁定：focus / blur / change(確認時才換算)
  tbody.querySelectorAll('input[data-ing]').forEach(inp => {
    const idx = parseInt(inp.dataset.ing);

    inp.addEventListener('focus', () => { focusedIngIdx = idx; });

    inp.addEventListener('blur', () => {
      focusedIngIdx = null;
      triggerFromIng(idx, parseFloat(inp.value));
    });

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { inp.blur(); }
    });
  });
}

function triggerFromIng(ingIdx, val) {
  if (isNaN(val) || val < 0) return;
  const f = flavors[current];
  const fTotal = ft(f);
  const ratio = f.ingredients[ingIdx].base / fTotal;
  const newTotal = val / ratio;
  applyTotal(newTotal);
}

function renderCream(creamAmt) {
  const f = flavors[current];
  const block = document.getElementById('creamBlock');
  if (!f.hasCream) { block.style.display='none'; return; }
  block.style.display='block';
  const cr = f.creamRecipe;
  const scale = creamAmt !== null ? creamAmt / cr.useAmount : null;
  const tbl = document.getElementById('creamTable');
  tbl.innerHTML='';
  cr.ingredients.forEach(ing => {
    const amt = scale !== null ? r(ing.base*scale,2) : '—';
    const tr = document.createElement('tr');
    tr.innerHTML=`<td>${ing.name}</td><td class="c-val">${amt!=='—'?amt+' g':'—'}</td>`;
    tbl.appendChild(tr);
  });
  const yieldAmt = scale !== null ? r(cr.baseYield*scale,1) : null;
  const tot = document.createElement('tr');
  tot.innerHTML=`<td>製作總量</td><td class="c-val">${yieldAmt!==null?yieldAmt+' g':'—'}</td>`;
  tbl.appendChild(tot);
  const note = document.getElementById('creamNote');
  if (creamAmt !== null) {
    note.textContent=`製作完成後取 ${r(creamAmt,1)} g 加入，剩餘約 ${r(yieldAmt-creamAmt,1)} g。`;
  } else {
    note.textContent='輸入用量後會顯示需要製作的奶霜份量。';
  }
}

function updateSummary(total) {
  const f=flavors[current]; const fTotal=ft(f);
  const yRatio=f.ingredients.find(i=>i.key==='yogurt').base/fTotal;
  document.getElementById('r-yogurt').textContent=total!==null?r(total*yRatio):'—';
  document.getElementById('r-total').textContent=total!==null?r(total):'—';
  document.getElementById('r-portions').textContent=total!==null?r(total/f.portionSize):'—';
}

// 快速輸入區
document.getElementById('yogurtInput').addEventListener('focus', () => { focusedIngIdx = -1; });
document.getElementById('yogurtInput').addEventListener('blur', () => {
  focusedIngIdx = null;
  const val = parseFloat(document.getElementById('yogurtInput').value);
  if (isNaN(val)||val<0) return;
  const f=flavors[current]; const fTotal=ft(f);
  const yRatio=f.ingredients.find(i=>i.key==='yogurt').base/fTotal;
  applyTotal(val/yRatio);
});
document.getElementById('yogurtInput').addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });

document.getElementById('totalInput').addEventListener('focus', () => { focusedIngIdx = -2; });
document.getElementById('totalInput').addEventListener('blur', () => {
  focusedIngIdx = null;
  const val = parseFloat(document.getElementById('totalInput').value);
  if (isNaN(val)||val<0) return;
  applyTotal(val);
});
document.getElementById('totalInput').addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });

document.getElementById('resetBtn').addEventListener('click',()=>{
  currentTotal = null;
  document.getElementById('yogurtInput').value='';
  document.getElementById('totalInput').value='';
  document.querySelectorAll('input[data-ing]').forEach(inp=>inp.value='');
  const totCell=document.getElementById('total-cell');
  if(totCell) totCell.textContent='—';
  renderCream(null);
  updateSummary(null);
});

// 口味 tabs
const tabsEl=document.getElementById('flavorTabs');
flavors.forEach((f,i)=>{
  const btn=document.createElement('button');
  btn.className='tab-btn'+(i===0?' active':'');
  btn.textContent=f.name; btn.onclick=()=>selectFlavor(i);
  tabsEl.appendChild(btn);
});

buildTable();
renderCream(null);
</script>
</body>
</html>
